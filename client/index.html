<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d28d9" />

    <!--
      Site-level defaults.

      `useSeo` replaces these per route in the browser, which is what Google
      sees, because it renders JavaScript. The link scrapers behind Facebook,
      WhatsApp, Slack and X do not: they read this file and nothing else. So a
      shared link previews as the shop rather than as a blank card, which is
      what it did before. A book's own page (/book/:id) gets that book's
      title, price and cover written in by the server instead; see
      server/utils/sharePreview.ts.
    -->
    <title>BookStoreBD — New and second-hand books across Bangladesh</title>
    <meta
      name="description"
      content="BookStoreBD - buy and sell new and second-hand books in Bangladesh, with wishlists, order tracking and buyer-seller chat."
    />

    <meta property="og:site_name" content="BookStoreBD" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BookStoreBD — New and second-hand books across Bangladesh" />
    <meta
      property="og:description"
      content="Buy and sell new and second-hand books in Bangladesh, with wishlists, order tracking and buyer-seller chat."
    />
    <!-- Relative here because the domain is not known at build time. Not every
         scraper resolves it, so the server writes the full address in before
         sending the page (renderSitePage in server/utils/sharePreview.ts). -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BookStoreBD - new and second-hand books, one tap away" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookStoreBD — New and second-hand books across Bangladesh" />
    <meta
      name="twitter:description"
      content="Buy and sell new and second-hand books in Bangladesh, with wishlists, order tracking and buyer-seller chat."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
