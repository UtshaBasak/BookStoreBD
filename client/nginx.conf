# Security headers for the documents nginx serves.
#
# These have to live here as well as in the API's helmet configuration, because
# CSP is enforced per document: the policy that governs the page is the one sent
# with index.html, which nginx serves, not the one on an API response. The two
# must stay in step - see server/config/securityHeaders.ts.
#
# nginx does not merge add_header across levels: a block with its own add_header
# discards every inherited one. That is why the set is repeated in /assets/
# below rather than only declared once here.
map $host $security_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://ui-avatars.com https://images.unsplash.com https://a-static.besthdwallpaper.com; connect-src 'self' https://api.cloudinary.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self' blob:";
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    add_header Content-Security-Policy   $security_csp            always;
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-Frame-Options           "DENY"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Ignored by browsers over plain HTTP, so this is inert locally and correct
    # once TLS terminates in front.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The API is proxied rather than called cross-origin, so the browser sees a
    # single origin and the refresh cookie is first-party. One namespace keeps
    # it unambiguous: /cart is a page, /api/cart is the endpoint.
    location ~ ^/(api|health)(/|$) {
        proxy_pass         http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Upgrade headers so Socket.IO can negotiate a websocket.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # Book covers are base64, so responses are large.
        client_max_body_size 25m;
        # The API sends its own security headers through helmet; nothing is
        # added here, so nothing is discarded either.
    }

    # A crawler looks for these two at the root and nowhere else. They are
    # generated rather than static files: the sitemap has to list the books that
    # exist right now, and both need the origin the request arrived on.
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass         http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # `$http_host` rather than `$host`: the latter drops the port, so a
        # sitemap served from localhost:8080 advertised URLs on localhost:80.
        proxy_set_header   X-Forwarded-Host  $http_host;
    }

    location /socket.io/ {
        proxy_pass         http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # Client-side routes are not files on disk, so anything that does not
    # resolve falls through to the app shell rather than 404ing on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change on every build, so they can be cached hard.
    # `expires` emits its own Cache-Control, so setting the header directly
    # avoids sending the directive twice. The security headers are repeated
    # because this block's own add_header would otherwise discard them.
    location /assets/ {
        add_header Cache-Control             "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy   $security_csp            always;
        add_header X-Content-Type-Options    "nosniff"                always;
        add_header X-Frame-Options           "DENY"                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
