server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The API is proxied rather than called cross-origin, so the browser sees a
    # single origin and the refresh cookie is first-party. Keep this list in
    # step with server/config/apiPaths.js.
    location ~ ^/(auth|book|cart|chat|filter|health|order|purchase|return|upload|uploads|user|wishlist)(/|$) {
        proxy_pass         http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Upgrade headers so Socket.IO can negotiate a websocket.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # Book covers are base64, so responses are large.
        client_max_body_size 25m;
    }

    location /socket.io/ {
        proxy_pass         http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # Client-side routes are not files on disk, so anything that does not
    # resolve falls through to the app shell rather than 404ing on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change on every build, so they can be cached hard.
    # `expires` emits its own Cache-Control, so setting the header directly
    # avoids sending the directive twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
