# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This repository has three npm manifests (root tooling, client, server), so
# each one needs its own entry — Dependabot does not recurse into directories.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Root: shared tooling only (concurrently)
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      root-tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Client: React + Vite frontend
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - client
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      # React and the router are released together; updating them as one group
      # keeps the build consistent.
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - "@types/react"
          - "@types/react-dom"
      # Vite, its React plugin and Tailwind are tightly coupled to each other.
      build-tooling:
        patterns:
          - vite
          - "@vitejs/*"
          - tailwindcss
          - "@tailwindcss/*"
      linting:
        patterns:
          - eslint
          - "@eslint/*"
          - eslint-plugin-*
          - typescript-eslint
          - globals
      # The compiler and the declarations it reads move together, so they are
      # updated as one group.
      typescript:
        patterns:
          - typescript
          - "@types/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint's peer range is `<6.1.0`, so a TypeScript 7 bump would
      # fail `npm ci` with ERESOLVE. Remove once typescript-eslint supports 7.
      - dependency-name: typescript
        versions: ['>=7']

  # ---------------------------------------------------------------------------
  # Server: Express + MongoDB API
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - server
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      linting:
        patterns:
          - eslint
          - "@eslint/*"
          - typescript-eslint
          - globals
      typescript:
        patterns:
          - typescript
          - tsx
          - "@types/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint's peer range is `<6.1.0`, so a TypeScript 7 bump would
      # fail `npm ci` with ERESOLVE. Remove once typescript-eslint supports 7.
      - dependency-name: typescript
        versions: ['>=7']

  # ---------------------------------------------------------------------------
  # GitHub Actions used by the CI and Docker workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Base images in the Dockerfiles (root, client and server)
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directories:
      - /
      - /client
      - /server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
      include: scope
    groups:
      base-images:
        patterns:
          - "*"
    # Node stays on its LTS line; a new major is a deliberate upgrade.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
