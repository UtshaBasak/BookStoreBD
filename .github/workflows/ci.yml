name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Without this, the workflow inherits the repository default, which is usually
# write access to every scope. These jobs only check out the code and run npm,
# so read access to the contents is all they need.
permissions:
  contents: read

jobs:
  client:
    name: Client (lint + types + tests + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Vite strips types rather than checking them, so the build on its own
      # would not catch a type error. This is the step that does. It reads the
      # shared API contract from server/shared, which the checkout provides.
      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  server:
    name: Server (lint + types + tests + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Covers the tests and the contract assertions as well as the app; the
      # build below compiles only what ships.
      - name: Type-check
        run: npm run typecheck

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
