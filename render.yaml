# Render Blueprint: one Web Service that serves the API and the built site.
#
# One service rather than an API and a static site: same-origin is what keeps
# the refresh cookie first-party, so a session survives its 15-minute access
# token. Two services would sign everyone out every quarter of an hour.
#
# Create it with Render -> New -> Blueprint -> this repository. Values marked
# `sync: false` are asked for in the dashboard at that point and never live in
# the repository.

services:
  - type: web
    name: bookstorebd
    runtime: node
    plan: free
    # The nearest region to Bangladesh. Put the MongoDB Atlas cluster in
    # Singapore too, so every query is not a round trip to another continent.
    region: singapore
    branch: master
    autoDeploy: true
    # Dev dependencies included: TypeScript and Vite are needed to build, and
    # npm skips them when NODE_ENV is production.
    buildCommand: >-
      npm --prefix server ci --include=dev &&
      npm --prefix client ci --include=dev &&
      npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The API serves client/dist itself (see above).
      - key: SERVE_CLIENT
        value: "true"

      # --- Secrets: entered in the Render dashboard ---------------------------
      # The MongoDB Atlas connection string, for a cluster of its own - never
      # the team's database. Include the database name: ...mongodb.net/bookstorebd?...
      - key: MONGO
        sync: false
      # Signs access tokens. Generated by Render; changing it signs everyone out.
      - key: JWT_SECRET
        generateValue: true
      # The address(es) made administrator on their next sign-in.
      - key: ADMIN_EMAILS
        sync: false

      # --- E-mail: one-time codes for sign-up and password reset ------------
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_USER
        sync: false
      # A Gmail App Password, not the account password.
      - key: SMTP_PASS
        sync: false
      # Render's free plan blocks the SMTP ports, so mail goes over Gmail's
      # web API instead: all three from Google Cloud and `npm run gmail:token`.
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false

      # --- Image hosting ------------------------------------------------------
      # The cloud name and API key are not secret; the API secret is.
      - key: CLOUDINARY_CLOUD_NAME
        value: ***REMOVED***
      - key: CLOUDINARY_API_KEY
        value: "***REMOVED***"
      - key: CLOUDINARY_API_SECRET
        sync: false
