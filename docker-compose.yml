# Development stack: MongoDB, the API with hot reload, and the Vite dev server.
#
#   docker compose up            start everything
#   docker compose run --rm seed seed the database
#   docker compose down -v       stop and discard the database
#
# For a production-like build instead, see docker-compose.prod.yml.

name: bookstorebd

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      # Exposed so Compass or mongosh on the host can connect.
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # The API waits for this, so it starts after MongoDB's first-run setup.
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    image: bookstorebd-server:dev
    build:
      context: ./server
      target: development
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: '4000'
      # `mongo` is the service name; Compose resolves it on the shared network.
      MONGO: mongodb://mongo:27017/bookstorebd
      # Supplied in .env next to this file (copy .env.example).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env - see .env.example}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # The browser runs on the host, so the client's origin is localhost.
      CORS_ORIGINS: http://localhost:5173
      # Optional image hosting; unset means covers stay inline.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_SERVICE: ${SMTP_SERVICE:-gmail}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Optional sign-in extras; unset means no bot check and no Google button.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    # -L makes nodemon poll. Filesystem events raised on a Windows host do not
    # reach a Linux container, so without it edits never trigger a restart.
    command: ['npm', 'run', 'dev', '--', '--legacy-watch']
    volumes:
      - ./server:/app
      # Keeps the image's Linux-built node_modules rather than the host's. The
      # volume persists, so after a dependency change run `docker compose down -v`
      # before `up --build`, or the container keeps the previous node_modules.
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: development
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      # Resolved by the browser, not by the container, so it is the host port.
      VITE_API_URL: http://localhost:4000
      # Same watcher problem as the server; see the note on its command.
      VITE_USE_POLLING: 'true'
      # The dev-server proxy runs inside this container, so it resolves the API
      # by service name. `localhost` here would be the client container itself.
      VITE_PROXY_TARGET: http://server:4000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

  # One-shot helper: `docker compose run --rm test`
  #
  # mongodb-memory-server has no mongod build for Alpine, so the suite points
  # at the MongoDB service instead. Each test file still uses its own database.
  test:
    # Shares the server image, so one build keeps both current.
    image: bookstorebd-server:dev
    build:
      context: ./server
      target: development
    profiles: ['tools']
    environment:
      MONGO_TEST_URI: mongodb://mongo:27017/
    command: ['npm', 'test']
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  # One-shot helper: `docker compose run --rm seed`
  seed:
    image: bookstorebd-server:dev
    build:
      context: ./server
      target: development
    profiles: ['tools']
    environment:
      MONGO: mongodb://mongo:27017/bookstorebd
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env - see .env.example}
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env - see .env.example}
    command: ['npm', 'run', 'seed']
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
